    if (dist(cx, cy, heart.x, heart.y) < 80) return [];
    const out = [];
    for (let i = 0; i < 8; i++) {
      const a = i / 8 * Math.PI * 2;
      out.push({ x: cx + Math.cos(a) * 26, y: cy + Math.sin(a) * 26, vx: 0, vy: 0, r: 6, life: 5,
        color: "#c9f4ff", suspend: true, freeze: 1.0 + intensity() * 0.2, launched: false, launch: 230 });
    }
    return out;
  }

  function fireOnce(l) {
    if (l.kind === "shards") {
      for (const p of l.pts) {
        state.bullets.push({ x: p.x, y: p.y - 230, vx: 0, vy: 320, r: 6, life: 3, color: "#bff4ff",
          group: l.gid, landAt: { x: p.x, y: p.y, gid: l.gid } });
      }
      return;
    }
    if (l.kind === "implode") {
      const n = 16, R = 230;
      for (let i = 0; i < n; i++) {
        const a = i / n * Math.PI * 2;
        let d = Math.abs(a - l.gap) % (Math.PI * 2);
        if (d > Math.PI) d = Math.PI * 2 - d;
        if (d < 0.45) continue;
        state.bullets.push({ x: l.cx + Math.cos(a) * R, y: l.cy + Math.sin(a) * R,
          vx: -Math.cos(a) * 110, vy: -Math.sin(a) * 110, r: 6, life: 4, color: "#9fe8ff",
          group: l.gid, collapse: { x: l.cx, y: l.cy } });
      }
      burst(l.cx, l.cy, "#9fe8ff", 10, 120, 0.3);
    }
  }

  // ---------- ATTACK SELECTION ----------
  function attackList() {
    const t = state.time, w = WEIGHTS[phaseIndex()];
    return [
      { w: w[0], ok: () => t > 5, run: () => pushLaser(makeShards()) },
      { w: w[1], ok: () => t > 8, run: () => addGroup(bulletsSuspend()) },
      { w: w[2], ok: () => t > 18 && !kindActive("pendulum"), run: () => pushLaser(makePendulum()) },
      { w: w[3], ok: () => t > 25 && !kindActive("blizzard"), run: () => pushLaser(makeBlizzard()) }
    ];
  }

  function spawnTick() {
    const count = Math.random() < 0.3 + intensity() * 0.4 ? 2 : 1;
    for (let i = 0; i < Math.min(count, MAX_ATTACKS_PER_TICK); i++) {
      if (activeAttacks() >= DIFF.maxAttacks) break;
      const list = attackList().filter(a => a.ok());
      const total = list.reduce((sum, a) => sum + a.w, 0);
      let r = Math.random() * total;
      for (const a of list) {
        r -= a.w;
        if (r <= 0) { a.run(); break; }
      }
    }
  }

  // ---------- UPDATE ----------
  function update(dt) {
    const s = state;
    s.time += dt;
    s.invuln -= dt;
    s.shake = Math.max(0, s.shake - dt * 30);
    s.flash = Math.max(0, s.flash - dt * 3);
    s.announce = Math.max(0, s.announce - dt);

    const p = phaseIndex();
    if (p !== s.phase) {
      s.phase = p;
      s.announce = 2.5;
      ring(seraphX(), SERAPH_Y, 20, 260, "#9fe8ff", 0.9);
      burst(seraphX(), SERAPH_Y, "#9fe8ff", 24, 200, 0.6);
    }

    let dx = 0, dy = 0;
    if (keys["ArrowLeft"] || keys["KeyA"]) dx -= 1;
    if (keys["ArrowRight"] || keys["KeyD"]) dx += 1;
    if (keys["ArrowUp"] || keys["KeyW"]) dy -= 1;
    if (keys["ArrowDown"] || keys["KeyS"]) dy += 1;
    if (dx || dy) {
      const m = Math.hypot(dx, dy);
      s.dashDx = dx / m;
      s.dashDy = dy / m;
      if (s.dashT <= 0) {
        heart.x += (dx / m) * SPEED * dt;
        heart.y += (dy / m) * SPEED * dt;
      }
    }

    s.dashCd -= dt;
    if (s.dashT > 0) {
      s.dashT -= dt;
      heart.x += s.dashDx * DASH_SPEED * dt;
      heart.y += s.dashDy * DASH_SPEED * dt;
      s.dashTrail.push({ x: heart.x, y: heart.y, life: 0.25 });
    }
    if (pointerTarget && s.dashT <= 0) {
      const ease = Math.min(1, dt * 18);
      heart.x += (pointerTarget.x - heart.x) * ease;
      heart.y += (pointerTarget.y - heart.y) * ease;
    }
    clampHeart();
    s.dashTrail = s.dashTrail.filter(q => (q.life -= dt) > 0);

    s.cooldown -= dt;
    if (s.cooldown <= 0) {
      spawnTick();
      s.cooldown = Math.max(0.35, rand(0.6, 1.2) - intensity() * 0.6) * DIFF.spawn;
    }

    for (const l of s.lasers) {
      if (!l.scaled) { l.scaled = true; l.warn *= DIFF.warn; }
      l.age += dt;

      if (l.kind === "blizzard") {
        if (l.age > l.warn && l.age < l.warn + l.fire) {
          heart.x += l.dir * WIND * dt;
          clampHeart();
          if (l.nextAt < 0) l.nextAt = l.warn;
          if (l.age >= l.nextAt) {
            l.nextAt += 0.35;
            for (let i = 0; i < 2; i++) {
              s.bullets.push({ x: rand(BOX.x + 10, BOX.x + BOX.w - 10), y: BOX.y - 10, vx: l.dir * 30, vy: 150,
                r: 4, life: 4, color: "#e6fbff", group: l.gid });
            }
          }
        }
        continue;
      }

      if (l.kind === "pendulum") {
        if (l.age > l.warn && l.age < l.warn + l.fire) {
          const tip = pendulumTip(l);
          if (distToSegment(heart.x, heart.y, l.px, l.py, tip.x, tip.y) < heart.r + 9) damage();
        }
        continue;
      }

      if (l.kind === "crystal") {
        if (l.age > l.warn && l.age < l.warn + l.fire && dist(heart.x, heart.y, l.x, l.y) < l.r + heart.r) damage();
        continue;
      }
      if (l.once && !l.fired && l.age >= l.warn) {
        l.fired = true;
        fireOnce(l);
      }
    }
    s.lasers = s.lasers.filter(l => l.age < l.warn + l.fire + 0.1);

    for (const b of s.bullets) {
      if (b.suspend) {
        if (b.freeze > 0) b.freeze -= dt;
        if (b.freeze <= 0 && !b.launched) {
          b.launched = true;
          const ang = Math.atan2(heart.y - b.y, heart.x - b.x);
          b.vx = Math.cos(ang) * b.launch;
          b.vy = Math.sin(ang) * b.launch;
        }
      }
      b.x += b.vx * dt * DIFF.speed;
      b.y += b.vy * dt * DIFF.speed;
      b.life -= dt;

      b.trail = b.trail || [];
      b.trail.push({ x: b.x, y: b.y });
      if (b.trail.length > 5) b.trail.shift();

      if (b.landAt && b.y >= b.landAt.y) {
        b.dead = true;
        state.lasers.push({ kind: "crystal", x: b.landAt.x, y: b.landAt.y, r: 22, gid: b.landAt.gid,
          age: 0, warn: 0.2, fire: 2.0, scaled: false });
        burst(b.landAt.x, b.landAt.y, "#bff4ff", 14, 140, 0.4);
      }
      if (b.collapse && dist(b.x, b.y, b.collapse.x, b.collapse.y) < 36) b.dead = true;
      if (!b.dead && dist(b.x, b.y, heart.x, heart.y) < b.r + heart.r - 2) {
        b.dead = true;
        damage();
      }
    }
    s.bullets = s.bullets.filter(b => !b.dead && b.life > 0 &&
      b.x > -200 && b.x < W + 200 && b.y > -200 && b.y < H + 200);

    if (s.time >= SURVIVE && s.running) {
      s.running = false;
      endFight("YOU SURVIVED", "Survived " + SURVIVE + " of " + SURVIVE + " seconds.");
    }
  }

  function tryDash() {
    if (!state || !state.running || state.dashCd > 0) return;
    state.dashT = DASH_TIME;
    state.dashCd = DASH_COOLDOWN;
    burst(heart.x, heart.y, "#7fe8ff", 10, 120, 0.35);
  }

  function damage() {
    if (!state.running || state.invuln > 0 || state.dashT > 0) return;
    state.hp -= HIT_DMG;
    state.invuln = INVULN;
    state.shake = 14;
    state.flash = 1;
    burst(heart.x, heart.y, "#9fe8ff", 22, 200, 0.6);
    ring(heart.x, heart.y, 6, 70, "#9fe8ff", 0.45);
    burst(heart.x, heart.y, "#ff1a2e", 14, 180, 0.5);
    if (state.hp <= 0) {
      state.hp = 0;
      state.running = false;
      endFight("YOU DIED", "Survived " + Math.floor(state.time) + " of " + SURVIVE + " seconds.");
    }
  }

  // ---------- DRAWING ----------
  function seg(x1, y1, x2, y2) { ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke(); }

  function drawWarnLine(x1, y1, x2, y2, color, alpha, width) {
    ctx.save();
    ctx.strokeStyle = color;
    ctx.globalAlpha = alpha;
    ctx.lineWidth = width;
    ctx.setLineDash([10, 8]);
    ctx.lineDashOffset = -clock * 80;
    seg(x1, y1, x2, y2);
    ctx.restore();
  }

  function heartShape(x, y, s) {
    ctx.beginPath();
    ctx.moveTo(x, y + s * 0.35);
    ctx.bezierCurveTo(x, y - s * 0.2, x - s, y - s * 0.2, x - s, y + s * 0.1);
    ctx.bezierCurveTo(x - s, y + s * 0.6, x, y + s * 0.8, x, y + s);
    ctx.bezierCurveTo(x, y + s * 0.8, x + s, y + s * 0.6, x + s, y + s * 0.1);
    ctx.bezierCurveTo(x + s, y - s * 0.2, x, y - s * 0.2, x, y + s * 0.35);
    ctx.closePath();
  }

  function drawBlade(x1, y1, x2, y2) {
    ctx.save();
    ctx.lineCap = "round";
    ctx.strokeStyle = "#5fc8ea";
    ctx.globalAlpha = 0.35; ctx.lineWidth = 22; seg(x1, y1, x2, y2);
    ctx.globalAlpha = 0.8; ctx.lineWidth = 9; seg(x1, y1, x2, y2);
    ctx.globalAlpha = 1; ctx.strokeStyle = "#ffffff"; ctx.lineWidth = 3; seg(x1, y1, x2, y2);
    ctx.restore();
  }

  function drawAttack(l, warning, pulse) {
    if (l.kind === "crystal") {
      const k = warning ? Math.max(0.2, l.age / l.warn) : 1;
      const fade = warning ? 1 : Math.max(0, Math.min(1, (l.warn + l.fire - l.age) / 0.4));
      ctx.save();
      ctx.globalAlpha = fade;
      ctx.translate(l.x, l.y);
      ctx.scale(k, k);
      ctx.beginPath();
      for (let i = 0; i < 12; i++) {
        const a = i / 12 * Math.PI * 2 - Math.PI / 2;
        const r = (i % 2 === 0 ? l.r : l.r * 0.45) * (1 + 0.04 * Math.sin(clock * 6 + i));
        const px = Math.cos(a) * r, py = Math.sin(a) * r;
        if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
      }
      ctx.closePath();
      if (warning) {
        ctx.setLineDash([5, 5]);
        ctx.lineDashOffset = -clock * 40;
        ctx.strokeStyle = "rgba(191,244,255," + (0.4 + 0.5 * pulse) + ")";
        ctx.lineWidth = 2;
        ctx.stroke();
      } else {
        const g = ctx.createRadialGradient(0, 0, 2, 0, 0, l.r);
        g.addColorStop(0, "rgba(255,255,255,0.95)");
        g.addColorStop(0.5, "rgba(127,232,255,0.8)");
        g.addColorStop(1, "rgba(29,75,107,0.6)");
        ctx.shadowColor = "#9fe8ff";
        ctx.shadowBlur = 14;
        ctx.fillStyle = g;
        ctx.fill();
        ctx.shadowBlur = 0;
        ctx.strokeStyle = "rgba(255,255,255,0.8)";
        ctx.lineWidth = 1.2;
        ctx.stroke();
      }
      ctx.restore();
      return;
    }
    if (l.kind === "shards") {
      if (warning) {
        const k = l.age / l.warn;
        for (const p of l.pts) {
          ctx.save();
          ctx.setLineDash([6, 8]);
          ctx.lineDashOffset = -clock * 60;
          ctx.strokeStyle = "rgba(159,232,255," + (0.3 + 0.4 * pulse) + ")";
          ctx.lineWidth = 1.5;
          seg(p.x, BOX.y, p.x, p.y);
          ctx.restore();
          ctx.fillStyle = "rgba(191,244,255," + (0.3 + 0.6 * k) + ")";
          ctx.beginPath();
          ctx.moveTo(p.x, p.y - 7); ctx.lineTo(p.x + 4, p.y); ctx.lineTo(p.x, p.y + 7); ctx.lineTo(p.x - 4, p.y);
          ctx.closePath(); ctx.fill();
        }
      }
      return;
    }

    if (l.kind === "implode") {
      if (warning) {
        const k = l.age / l.warn;
        ctx.fillStyle = "rgba(159,232,255,0.08)";
        ctx.beginPath(); ctx.moveTo(l.cx, l.cy);
        ctx.arc(l.cx, l.cy, 240, l.gap - 0.45, l.gap + 0.45);
        ctx.closePath(); ctx.fill();
        ctx.save();
        ctx.setLineDash([10, 10]);
        ctx.lineDashOffset = -clock * 80;
        ctx.strokeStyle = "rgba(159,232,255,0.7)";
        ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(l.cx, l.cy, 230 - 120 * k, 0, Math.PI * 2); ctx.stroke();
        ctx.restore();
      }
      return;
    }

    if (l.kind === "pendulum") {
      if (warning) {
        ctx.save();
        ctx.setLineDash([6, 8]);
        ctx.lineDashOffset = -clock * 50;
        ctx.strokeStyle = "rgba(159,232,255," + (0.35 + 0.35 * pulse) + ")";
        ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(l.px, l.py, l.len, Math.PI / 2 - l.amp, Math.PI / 2 + l.amp); ctx.stroke();
        ctx.restore();
      } else {
        const tip = pendulumTip(l);
        drawBlade(l.px, l.py, tip.x, tip.y);
      }
      ctx.fillStyle = "#e8fbff";
      ctx.beginPath(); ctx.arc(l.px, l.py, 5, 0, Math.PI * 2); ctx.fill();
      return;
    }

    if (l.kind === "blizzard") {
      if (warning) {
        ctx.save();
        ctx.fillStyle = "rgba(230,251,255," + (0.3 + 0.5 * pulse) + ")";
        for (let i = 0; i < 4; i++) {
          const y = BOX.y + 40 + i * 70;
          const x = l.dir > 0 ? BOX.x + 12 : BOX.x + BOX.w - 12;
          ctx.beginPath();
          ctx.moveTo(x - l.dir * 8, y - 6); ctx.lineTo(x + l.dir * 8, y); ctx.lineTo(x - l.dir * 8, y + 6);
          ctx.closePath(); ctx.fill();
        }
        ctx.restore();
      } else {
        ctx.save();
        ctx.strokeStyle = "rgba(230,251,255,0.45)";
        ctx.lineWidth = 1.5;
        for (let k = 0; k < 22; k++) {
          const x = BOX.x + mod(k * 37 + clock * 140 * l.dir, BOX.w);
          const y = BOX.y + mod(k * 71 + clock * 220, BOX.h);
          seg(x, y, x + l.dir * 14, y + 10);
        }
        ctx.restore();
      }
    }
  }

  function drawBullets() {
    for (const b of state.bullets) {
      const c = b.color || "#ffffff";
      if (b.trail) {
        for (let i = 0; i < b.trail.length; i++) {
          const tp = b.trail[i], f = (i + 1) / b.trail.length;
          ctx.globalAlpha = f * 0.3;
          ctx.fillStyle = c;
          ctx.beginPath(); ctx.arc(tp.x, tp.y, b.r * (0.4 + 0.6 * f), 0, Math.PI * 2); ctx.fill();
        }
      }
      if (b.landAt) {
        ctx.save();
        ctx.strokeStyle = "rgba(191,244,255,0.85)";
        ctx.lineWidth = 2.5;
        ctx.shadowColor = "#9fe8ff";
        ctx.shadowBlur = 8;
        seg(b.x, b.y - 12, b.x, b.y + 4);
        ctx.restore();
      }
      if (b.suspend && !b.launched) {
        ctx.globalAlpha = 0.9;
        ctx.strokeStyle = "rgba(159,232,255,0.9)";
        ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.arc(b.x, b.y, b.r + 3, 0, Math.PI * 2); ctx.stroke();
      }
      ctx.globalAlpha = 0.25;
      ctx.fillStyle = c;
      ctx.beginPath(); ctx.arc(b.x, b.y, b.r * 2.3, 0, Math.PI * 2); ctx.fill();
      ctx.globalAlpha = 1;
      ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = "#ffffff";
      ctx.beginPath(); ctx.arc(b.x, b.y, b.r * 0.45, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  function drawSeraph(bx, by) {
    const ang = Math.atan2(heart.y - by, heart.x - bx);
    // halo
    ctx.save();
    ctx.strokeStyle = "rgba(159,232,255,0.85)";
    ctx.lineWidth = 2;
    ctx.shadowColor = "#9fe8ff";
    ctx.shadowBlur = 12;
    ctx.beginPath(); ctx.ellipse(bx, by - 38, 22, 6, 0, 0, Math.PI * 2); ctx.stroke();
    ctx.restore();

    // faceted crystal body
    const verts = [];
    for (let i = 0; i < 8; i++) {
      const a = i / 8 * Math.PI * 2 + clock * 0.4;
      const r = i % 2 === 0 ? 34 : 22;
      verts.push({ x: bx + Math.cos(a) * r, y: by + Math.sin(a) * r });
    }
    ctx.save();
    ctx.beginPath();
    verts.forEach((v, i) => { if (i === 0) ctx.moveTo(v.x, v.y); else ctx.lineTo(v.x, v.y); });
    ctx.closePath();
    const g = ctx.createLinearGradient(bx, by - 34, bx, by + 34);
    g.addColorStop(0, "#e8fbff");
    g.addColorStop(0.5, "#5fc8ea");
    g.addColorStop(1, "#1d4b6b");
    ctx.shadowColor = "#9fe8ff";
    ctx.shadowBlur = 20;
    ctx.fillStyle = g;
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.strokeStyle = "rgba(255,255,255,0.85)";
    ctx.lineWidth = 1.5;
    ctx.stroke();
    ctx.strokeStyle = "rgba(255,255,255,0.35)";
    for (const v of verts) seg(bx, by, v.x, v.y);
    ctx.restore();

    // eyes that watch the heart
    for (const side of [-9, 9]) {
      const ex = bx + side, ey = by - 3;
      ctx.fillStyle = "#ffffff";
      ctx.beginPath(); ctx.arc(ex, ey, 4, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = "#1d4b6b";
      ctx.beginPath(); ctx.arc(ex + Math.cos(ang) * 1.6, ey + Math.sin(ang) * 1.6, 2, 0, Math.PI * 2); ctx.fill();
    }
  }

  function draw() {
    const pulse = 0.5 + 0.5 * Math.sin(clock * 12);

    ctx.fillStyle = "#03080f";
    ctx.fillRect(0, 0, W, H);
    const glow = ctx.createRadialGradient(seraphX(), SERAPH_Y, 10, seraphX(), SERAPH_Y, 280);
    glow.addColorStop(0, "rgba(120,220,255,0.22)");
    glow.addColorStop(1, "rgba(0,0,0,0)");
    ctx.fillStyle = glow;
    ctx.fillRect(0, 0, W, H);
    drawFlakes();

    ctx.save();
    if (state.shake > 0) {
      ctx.translate((Math.random() - 0.5) * state.shake, (Math.random() - 0.5) * state.shake);
    }

    const floor = ctx.createLinearGradient(0, BOX.y, 0, BOX.y + BOX.h);
    floor.addColorStop(0, "#0b2233");
    floor.addColorStop(1, "#03060b");
    ctx.fillStyle = floor;
    ctx.fillRect(BOX.x, BOX.y, BOX.w, BOX.h);
    ctx.save();
    ctx.beginPath(); ctx.rect(BOX.x, BOX.y, BOX.w, BOX.h); ctx.clip();
    ctx.strokeStyle = "rgba(159,232,255,0.07)";
    ctx.lineWidth = 1;
    const off = mod(clock * 30, 40);
    for (let i = -BOX.h; i < BOX.w + BOX.h; i += 40) {
      seg(BOX.x + i + off, BOX.y, BOX.x + i + off + BOX.h, BOX.y + BOX.h);
    }
    ctx.restore();

    drawSeraph(seraphX(), SERAPH_Y);

    for (const l of state.lasers) drawAttack(l, l.age <= l.warn, pulse);
    drawBullets();
    drawFx();

    ctx.save();
    ctx.shadowColor = "#9fe8ff";
    ctx.shadowBlur = 16;
    ctx.strokeStyle = "rgba(255,255,255," + (0.7 + 0.3 * pulse) + ")";
    ctx.lineWidth = 3;
    ctx.strokeRect(BOX.x, BOX.y, BOX.w, BOX.h);
    ctx.restore();

    for (const q of state.dashTrail) {
      ctx.globalAlpha = Math.max(0, q.life / 0.25) * 0.45;
      ctx.fillStyle = "#7fe8ff";
      heartShape(q.x, q.y - 2, 7.5);
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    const dashing = state.dashT > 0;
    if (dashing || state.invuln <= 0 || Math.floor(state.invuln * 14) % 2 === 0) {
      ctx.save();
      ctx.shadowColor = dashing ? "#7fe8ff" : "#ff1a2e";
      ctx.shadowBlur = 16;
      ctx.fillStyle = dashing ? "#d8faff" : "#ff1a2e";
      heartShape(heart.x, heart.y - 2, 7.5);
      ctx.fill();
      ctx.restore();
    }
    ctx.restore();

    const vg = ctx.createRadialGradient(W / 2, H / 2, H * 0.35, W / 2, H / 2, H * 0.75);
    vg.addColorStop(0, "rgba(0,0,0,0)");
    vg.addColorStop(1, "rgba(0," + Math.round(20 * intensity()) + "," + Math.round(40 * intensity()) + "," + (0.55 + 0.25 * intensity()) + ")");
    ctx.fillStyle = vg;
    ctx.fillRect(0, 0, W, H);
    if (state.flash > 0) {
      ctx.fillStyle = "rgba(255,0,20," + (state.flash * 0.3) + ")";
      ctx.fillRect(0, 0, W, H);
    }

    // HUD
    const diff = Math.round(intensity() * 100);
    const tier = diff < 25 ? "UNEASY" : diff < 50 ? "DANGEROUS" : diff < 75 ? "HELLISH" : "HELL";
    ctx.font = "14px 'Courier New', monospace";
    ctx.fillStyle = "#fff";
    ctx.textAlign = "left";
    ctx.fillText("MODE: " + selectedDiff.toUpperCase(), BOX.x, 92);
    ctx.textAlign = "center";
    ctx.fillText("PHASE " + PHASE_NAMES[phaseIndex()], W / 2, 92);
    ctx.textAlign = "right";
    ctx.fillText(state.dashCd > 0 ? "DASH " + state.dashCd.toFixed(1) + "s" : "DASH READY", BOX.x + BOX.w, 92);

    ctx.fillStyle = "#0b2233";
    ctx.fillRect(BOX.x, 98, BOX.w, 8);
    ctx.save();
    ctx.fillStyle = diff < 50 ? "#9fe8ff" : "#ff3344";
    ctx.shadowColor = ctx.fillStyle;
    ctx.shadowBlur = 8;
    ctx.fillRect(BOX.x, 98, BOX.w * diff / 100, 8);
    ctx.restore();

    ctx.fillStyle = "#fff";
    ctx.textAlign = "left";
    ctx.fillText("INTENSITY: " + tier + " " + diff + "%", BOX.x, 120);
    ctx.textAlign = "right";
    ctx.fillText("ATTACKS " + activeAttacks() + "/" + DIFF.maxAttacks, BOX.x + BOX.w, 120);

    ctx.textAlign = "left";
    ctx.fillText("HP", BOX.x, 450);
    ctx.fillStyle = "#0b2233";
    ctx.fillRect(BOX.x + 40, 436, 200, 18);
    ctx.fillStyle = "#ff1a2e";
    ctx.fillRect(BOX.x + 40, 436, 200 * (state.hp / MAX_HP), 18);
    ctx.fillStyle = "#fff";
    ctx.textAlign = "right";
    ctx.fillText(state.hp + " / " + MAX_HP, BOX.x + BOX.w, 450);
    ctx.textAlign = "left";
    ctx.fillText("SURVIVE " + Math.max(0, Math.ceil(SURVIVE - state.time)) + "s", BOX.x, 474);

    if (state.announce > 0) {
      ctx.save();
      ctx.globalAlpha = Math.min(1, state.announce);
      ctx.font = "bold 28px 'Courier New', monospace";
      ctx.textAlign = "center";
      ctx.fillStyle = "#9fe8ff";
      ctx.shadowColor = "#9fe8ff";
      ctx.shadowBlur = 18;
      ctx.fillText("PHASE " + PHASE_NAMES[phaseIndex()], W / 2, 290);
      ctx.restore();
    }
  }

  function start(diff) {
    selectedDiff = diff;
    DIFF = PRESETS[diff];
    reset();
    state.running = true;
  }

  function frame(dt) {
    clock += dt;
    updateFx(dt);
    if (state && state.running) update(dt);
    if (state) draw();
  }

  return {
    name: "CRYSTAL SERAPH",
    start,
    frame,
    setPointer: (p) => { pointerTarget = p; },
    dash: () => tryDash(),
    stop: () => { if (state) state.running = false; },
    isRunning: () => !!(state && state.running)
  };
})();

// ---------- MENU BACKGROUND ----------
const menuDust = Array.from({ length: 80 }, () => ({
  x: Math.random() * W, y: Math.random() * H, vy: 6 + Math.random() * 18,
  s: 0.8 + Math.random() * 2.2, c: ["#ff3344", "#9dff5c", "#9fe8ff"][Math.floor(Math.random() * 3)]
}));
let menuClock = 0;
function drawMenu(dt) {
  menuClock += dt;
  ctx.fillStyle = "#000";
  ctx.fillRect(0, 0, W, H);
  const tints = [[255, 51, 68], [157, 255, 92], [159, 232, 255]];
  for (let i = 0; i < 3; i++) {
    const cx = W * (0.2 + 0.3 * i) + Math.sin(menuClock * 0.4 + i * 2) * 60;
    const cy = H * 0.5 + Math.cos(menuClock * 0.3 + i) * 60;
    const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, 260);
    g.addColorStop(0, "rgba(" + tints[i].join(",") + ",0.18)");
    g.addColorStop(1, "rgba(0,0,0,0)");
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);
  }
  ctx.globalAlpha = 0.5;
  for (const d of menuDust) {
    d.y -= d.vy * dt;
    if (d.y < -5) { d.y = H + 5; d.x = Math.random() * W; }
    ctx.fillStyle = d.c;
    ctx.fillRect(d.x, d.y, d.s, d.s);
  }
  ctx.globalAlpha = 1;
}

// ---------- MAIN LOOP ----------
let last = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  if (active) active.frame(dt);
  else drawMenu(dt);
  requestAnimationFrame(loop);
}

showFightSelect();
requestAnimationFrame(loop);
</script>
</body>
